{% extends "base.html" %}
{% block titulo %}Error del servidor | CLASISCO{% endblock %}

{% block contenido %}
<section class="seccion">
  <div class="container text-center py-5">
    <p class="error-codigo">500</p>
    <h1 class="h3 mb-3">Algo salió mal</h1>
    <p class="text-muted mb-4">
      Ocurrió un error inesperado. Nuestro equipo ya fue notificado; intenta de nuevo en un momento.
    </p>
    <a class="btn btn-cta btn-lg" href="{% url 'tienda:inicio' %}">
      <i class="fa-solid fa-house me-2"></i>Volver al inicio
    </a>
  </div>
</section>
{% endblock %}
